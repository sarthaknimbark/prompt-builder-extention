<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 128 128" role="img" aria-label="Prompt Builder">
  <!-- Modern premium gradient background with smooth corners -->
  <rect width="128" height="128" rx="28" fill="url(#bg-gradient)"/>
  
  <defs>
    <!-- State-of-the-art violet-purple-pink gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Glassmorphic prompt builder panel board representation -->
  <rect x="24" y="24" width="80" height="80" rx="16" ry="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Structured prompt blocks (glassmorphism/layer aesthetics) -->
  <!-- Role section tag (bright blue) -->
  <rect x="36" y="38" width="24" height="8" rx="4" fill="#60a5fa"/>
  <!-- Text lines (semi-transparent white) -->
  <rect x="36" y="52" width="56" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="36" y="62" width="44" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- Variables/Constraints section tag (lavender) -->
  <rect x="36" y="74" width="32" height="8" rx="4" fill="#a78bfa"/>
  <rect x="36" y="88" width="50" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>

  <!-- High-quality warm yellow AI sparkles indicating prompt generation/intelligence -->
  <!-- Primary Sparkle (top-right) -->
  <path d="M92 12c0 10 8 18 18 18-10 0-18 8-18 18 0-10-8-18-18-18 10 0 18-8 18-18z" fill="#fbbf24"/>
  <!-- Secondary Sparkle (middle-right) -->
  <path d="M104 44c0 4 3 7 7 7-4 0-7 3-7 7 0-4-3-7-7-7 4 0 7-3 7-7z" fill="#fef08a"/>
  <!-- Tertiary small Sparkle (bottom-left) -->
  <path d="M20 70c0 3 2 5 5 5-3 0-5 2-5 5 0-3-2-5-5-5 3 0 5-2 5-5z" fill="#ffffff" fill-opacity="0.8"/>
</svg>
